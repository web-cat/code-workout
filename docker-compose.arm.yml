services:
  db_dev:
    restart: unless-stopped
    # The base docker-compose.yml mounts the `dbdata` volume at
    # /var/lib/mariadb, but the mariadb:10.2 image actually stores its data
    # at /var/lib/mysql - so that volume was never capturing anything, and
    # the dev database got wiped every time db_dev's container was recreated
    # (docker compose down, a rebuild, a server restart). !override replaces
    # the base `volumes:` list outright (Compose merges lists by default)
    # so we end up with a single, correct, actually-persistent mount.
    volumes: !override
      - dbdata:/var/lib/mysql:delegated
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  db_test:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile-dev
    restart: unless-stopped
    depends_on:
      db_dev:
        condition: service_healthy
      db_test:
        condition: service_healthy
    # Rails crashes on boot if the DB doesn't exist / has no schema yet, which
    # is why we used to have to manually run `docker compose run web rake
    # db:populate` before every first start. This does it automatically:
    #   1. db:create   - make sure the `codeworkout` database exists (no-op
    #                    if it's already there).
    #   2. If schema_migrations already exists (e.g. the named `dbdata`
    #      volume has data from a previous run) just run db:migrate, so
    #      restarts don't wipe out existing data.
    #   3. Otherwise this is a fresh database, so run db:populate exactly
    #      like the README used to tell you to do by hand.
    command: >
      bash -c "
      bundle exec rake db:create &&
      (bundle exec rails runner 'exit(ActiveRecord::Base.connection.table_exists?(\"schema_migrations\") ? 0 : 1)' 2>/dev/null && bundle exec rake db:migrate || bundle exec rake db:populate) &&
      bash ./runservers.sh"
